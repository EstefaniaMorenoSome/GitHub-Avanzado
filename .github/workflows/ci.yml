name: CI - Develop

on:
  pull_request:
    branches:
      - develop
    types: [opened, synchronize, reopened]

  push:
    branches:
      - develop

  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Actualizar README con la feature
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          FEATURE="${{ github.head_ref }}"
          LINE="Añadida feature: $FEATURE"

          if grep -Fqx "$LINE" README.md; then
            echo "La feature ya está registrada en README."
          else
            echo "" >> README.md
            echo "$LINE" >> README.md
          fi

      - name: Guardar cambio en la rama feature
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md

          if git diff --cached --quiet; then
            echo "No hay cambios nuevos que guardar."
          else
            git commit -m "Actualizar README desde CI"
            git push
          fi

      - name: Ejecución sobre develop
        if: github.event_name != 'pull_request'
        run: echo "CI ejecutado sobre develop. El README ya se actualizó durante el Pull Request."

  validate-dev:
    needs: update-readme
    runs-on: self-hosted

    env:
      DEV_TOKEN: ${{ secrets.DEV_TOKEN }}

    steps:
      - name: Validar DEV_TOKEN
        shell: powershell
        run: |
          if ($env:DEV_TOKEN -eq $env:LOCAL_DEV_TOKEN) {
            Write-Host "DEV_TOKEN coincide con LOCAL_DEV_TOKEN."
            exit 0
          } else {
            Write-Host "DEV_TOKEN NO coincide con LOCAL_DEV_TOKEN."
            exit 1
          }
